# Union of the native targets used by the GitHub release workflow plus the
# wasm32-wasip2 guest embedded in every default-feature binary.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-linux-android",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-wasip2",
]

# ureq is dual-licensed and cargo-about can otherwise choose a different
# accepted license file on different platforms.
[ureq.clarify]
license = "Apache-2.0"

