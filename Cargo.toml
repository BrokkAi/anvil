[workspace]
members = ["xtask", "crates/anvil-minimizer"]
# Keep `cargo build` / `cargo test` from the workspace root focused on the
# root crate. The xtask sub-crate is dev-only and is invoked through the
# `cargo xtask` alias (see .cargo/config.toml), which builds it on demand.
default-members = ["."]

[package]
name = "brokk-anvil"
version = "0.27.0"
edition = "2024"
description = "Anvil: Rust ACP server with first-run setup for Codex, Ollama, and OpenRouter"
license = "LGPL-3.0-only"
repository = "https://github.com/BrokkAi/anvil"
homepage = "https://github.com/BrokkAi/anvil"
readme = "README.md"

[features]
default = ["wasm-sandbox", "http-api"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]
# `anvil serve` HTTP daemon (#317/#346). Default-on; all official release
# binaries ship it. `--no-default-features --features wasm-sandbox` builds
# an ACP-only binary without the axum dependency tree.
http-api = ["dep:axum"]

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "2", features = ["unstable"] }
# HTTP daemon for `anvil serve` (#317). Server-side only; LLM/MCP client
# traffic stays on `reqwest`. Optional: gated behind the `http-api` feature.
axum = { version = "0.8", optional = true }
# Dependency-renamed so imports stay `anvil_minimizer::` while the published
# crate is namespaced. The minimizer is versioned in lockstep with this crate:
# bump this requirement, the minimizer's version, and the root version
# together on every release (CI enforces the match).
anvil-minimizer = { package = "brokk-anvil-minimizer", version = "0.27.0", path = "crates/anvil-minimizer" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# Pure-parsing library, also built as a wasm32-wasip2 binary that
# wasmtime hosts when the wasm sandbox is enabled.
brokk-acp-sandbox = "0.1.0"
# Embedded wasm runtime + WASI Preview 2 bindings for the sandboxed
# parser. Used to host `brokk-acp-sandbox.wasm` in-process with
# fuel-based CPU limits and capability-scoped fs access.
wasmtime = { version = "45", optional = true, default-features = false, features = ["cranelift", "cache", "parallel-compilation", "component-model", "runtime"] }
wasmtime-wasi = { version = "45", optional = true }
zip = "8"
futures = "0.3"
fs2 = "0.4"
bytes = "1"
regex = "1"
reqwest = { version = "0.13", features = ["stream", "json", "cookies", "form"] }
aws-config = { version = "1.9", default-features = false, features = ["credentials-process", "rt-tokio", "sso"] }
aws-credential-types = "1.3"
aws-sigv4 = "1.5"
aws-smithy-runtime-api = "1.13"
aws-smithy-http-client = { version = "1.2", default-features = false, features = ["rustls-ring"] }
http = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
jsonschema = "0.46"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
walkdir = "2"
rustls-native-certs = "0.8"
sha2 = "0.11"
# Codex login. Browser login uses PKCE + a localhost loopback callback; device
# authorization covers SSH/remote clients. RFC 8693 token exchange and refresh
# are direct `reqwest` calls in `codex_auth.rs`. JWT decoding for the account_id
# is inline (no `jsonwebtoken` dep) since we trust the issuer over HTTPS and only
# need the unverified `chatgpt_account_id` claim.
oauth2 = { version = "5", default-features = false }
tiny_http = "0.12"
webbrowser = "1"
base64 = "0.22"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
# YAML frontmatter parser for Agent Skills (`SKILL.md`). `serde_yaml` is
# archived but stable and is what codex's core-skills uses; staying on it
# avoids ecosystem churn. Revisit only on CVE.
serde_yaml = "0.9"
# Token counter for context-window accounting. Mirrors the Java side
# (Brokk's `Messages.getApproximateTokens` uses jtokkit with
# `O200K_BASE`), so both halves of the session zip read the same numbers.
# `o200k_base` is the GPT-4o / o-series tokenizer; we apply it uniformly
# to every model since no small/accurate alternative exists for
# Claude/Gemini/Llama and the count is an approximation used to trigger
# compression, not a billing figure.
tiktoken-rs = "0.12"

# Unix-only: `setrlimit` via `Command::pre_exec` for per-process resource caps
# applied to `runShellCommand`. See `tools/shell.rs::apply_rlimits`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `test-util` enables `tokio::time::pause()` and `#[tokio::test(start_paused = true)]`,
# used by the LLM stream idle-timeout test to avoid waiting wall-clock seconds.
tokio = { version = "1", features = ["test-util"] }
# Used by `agents_md` tests to build throwaway project trees (`.git`
# marker + AGENTS.md/CLAUDE.md fixtures) without polluting the working
# directory.
tempfile = "3"
# Used by `discovery::tests` to mock the Ollama `/v1/models` HTTP
# response shape and validate that `discover_ollama` parses it
# correctly. Without a mock, the existing tests only exercise the
# connection-refused error path.
wiremock = "0.6"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
