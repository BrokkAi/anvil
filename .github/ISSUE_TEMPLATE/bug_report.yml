name: Other bug
description: Report a problem with installation, startup, an integration, documentation, or other non-session behavior.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use the agent or runtime bug form instead when Anvil behaved incorrectly during an ACP session.

  - type: dropdown
    id: affected-surface
    attributes:
      label: Affected surface
      description: Where did you encounter the problem?
      options:
        - Installation, build, or release packaging
        - Startup or configuration
        - Model provider setup or authentication
        - ACP client or editor integration
        - Example clients or automation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: What happened?
      description: Describe the problem and its effect on your workflow.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: List the smallest set of steps you know. If the problem is intermittent, describe when it tends to occur.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
      description: Describe the behavior you expected instead.
    validations:
      required: true

  - type: input
    id: version-environment
    attributes:
      label: Version and environment
      description: Optionally include the Anvil version or commit, ACP client, operating system, and relevant configuration.

  - type: textarea
    id: additional-context
    attributes:
      label: Logs, screenshots, or other context
      description: Optionally add anything else that may help us understand the problem. Please remove secrets and private data.
