name: Nightly macOS CI

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Harden cargo's network layer against transient crates.io index fetches.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build and test macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Anvil
        run: cargo build --release

      - name: Run tests
        run: cargo test

  report-failure:
    name: Report nightly result
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Create, update, or close failure issue
        uses: actions/github-script@v8
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Nightly macOS CI is failing';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const marker = '<!-- nightly-macos-ci-failure -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const issue = issues.find(candidate =>
              !candidate.pull_request && candidate.title === title
            );

            if (process.env.BUILD_RESULT === 'success') {
              if (issue?.state === 'open') {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Recovered in ${runUrl}. Closing this issue.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              return;
            }

            const body = `${marker}\nThe nightly macOS CI workflow failed or did not complete successfully.\n\nLatest run: ${runUrl}\nResult: **${process.env.BUILD_RESULT}**`;
            if (!issue) {
              await github.rest.issues.create({ owner, repo, title, body });
              return;
            }

            if (issue.state === 'closed') {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `Nightly macOS CI failed again.\n\nRun: ${runUrl}\nResult: **${process.env.BUILD_RESULT}**`,
            });
