name: Publish crate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io instead of running a dry-run
        required: false
        default: false
        type: boolean

# Harden cargo's network layer against transient crates.io index fetches that
# intermittently abort the publish with `[16] Error in the HTTP2 framing layer`
# while curl pulls the sparse index over HTTP/2. Forcing HTTP/1.1 sidesteps the
# multiplexing bug and the retry bump rides out brief CDN blips.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  publish:
    name: Publish brokk-anvil to crates.io
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-
            ${{ runner.os }}-cargo-

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match Cargo.toml version ($CARGO_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Tag and Cargo.toml versions match: $CARGO_VERSION"

      # brokk-anvil-minimizer and brokk-anvil-llm are versioned in lockstep
      # with brokk-anvil so the published sub-crates always correspond to the
      # release tag and can never silently drift from the workspace sources.
      - name: Verify workspace version lockstep
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          for CRATE in minimizer llm; do
            SUB=$(grep -m1 '^version = ' crates/anvil-$CRATE/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            REQ=$(grep -m1 "^anvil-$CRATE = " Cargo.toml | sed -E 's/.*version = "([^"]*)".*/\1/')
            if [ "$ROOT" != "$SUB" ] || [ "$ROOT" != "$REQ" ]; then
              echo "::error::Version lockstep violated: brokk-anvil=$ROOT, brokk-anvil-$CRATE=$SUB, dependency requirement=$REQ."
              exit 1
            fi
          done
          echo "Workspace versions in lockstep: $ROOT"

      - name: Verify minimizer package
        run: cargo publish --dry-run -p brokk-anvil-minimizer --locked

      - name: Verify LLM client package
        run: cargo publish --dry-run -p brokk-anvil-llm --locked

      # brokk-anvil's verification build resolves brokk-anvil-minimizer and
      # brokk-anvil-llm from crates.io (the root build.rs runs a nested
      # `cargo metadata`, which cannot see the local workspace once the
      # package is assembled). Under lockstep versioning the sub-crate
      # versions are new on every release, so the full verification build is
      # only possible after the sub-crates are uploaded: `cargo publish`
      # performs it before the actual upload in the publish step below. Here
      # we verify everything that does not need the registry: packaging,
      # manifest validity, and dependency resolution (all three packages are
      # listed so cargo overlays the local sub-crates).
      - name: Verify brokk-anvil package (no build)
        run: cargo publish --dry-run --no-verify -p brokk-anvil-minimizer -p brokk-anvil-llm -p brokk-anvil --locked

      - name: Authenticate with crates.io
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.4

      # Publish the sub-crates before brokk-anvil (which depends on them), and
      # skip any version that is already on crates.io so a partially failed
      # run can be retried safely. `cargo publish` runs the full verification
      # build before each upload and blocks until the uploaded crate has
      # propagated to the index, so brokk-anvil's verification can resolve the
      # just-published sub-crates.
      - name: Publish crates
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          ua="BrokkAi/anvil publish-crate workflow (https://github.com/BrokkAi/anvil)"
          version_published() {
            curl -sf --retry 3 -H "User-Agent: $ua" \
              "https://crates.io/api/v1/crates/$1/$2" > /dev/null
          }
          publish_if_missing() {
            local crate="$1" manifest="$2" version
            version=$(grep -m1 '^version = ' "$manifest" | sed -E 's/version = "(.*)"/\1/')
            if version_published "$crate" "$version"; then
              echo "$crate $version is already on crates.io; skipping"
            else
              cargo publish -p "$crate" --locked
            fi
          }
          publish_if_missing brokk-anvil-minimizer crates/anvil-minimizer/Cargo.toml
          publish_if_missing brokk-anvil-llm crates/anvil-llm/Cargo.toml
          publish_if_missing brokk-anvil Cargo.toml
