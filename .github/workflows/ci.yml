name: CI

on:
  push:
    branches: [ 'master', 'ci/**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ 'master' ]

# Harden cargo's network layer against transient crates.io index fetches that
# intermittently abort a job with `[16] Error in the HTTP2 framing layer` while
# curl pulls the sparse index over HTTP/2. Forcing HTTP/1.1 sidesteps the
# multiplexing bug and the retry bump rides out brief CDN blips.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  python-package:
    name: Python launcher package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: python/pyproject.toml

    - name: Verify Python and Cargo versions match
      run: python python/scripts/check_version.py

    - name: Test the launcher
      run: PYTHONPATH=python python -m unittest discover -s python/tests -v

    - name: Install pinned packaging tools
      run: python -m pip install build==1.5.0 twine==6.2.0

    - name: Build and inspect distributions
      run: |
        python -m build python --outdir python/dist
        python -m twine check python/dist/*

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: sdk/typescript/package-lock.json

    - name: Install pinned SDK build tools
      run: npm ci --prefix sdk/typescript

    - name: Check locked dependencies
      run: npm audit --prefix sdk/typescript --audit-level=high

    - name: Regenerate the wire layer
      run: node scripts/generate-sdks.mjs

    - name: Require checked-in generated output
      run: git diff --exit-code -- sdk/typescript/src/generated

    - name: Build and test the package
      run: npm --prefix sdk/typescript test

    - name: Inspect the publish tarball
      run: npm pack ./sdk/typescript --dry-run

    - name: Install Rust toolchain for live conformance
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip2

    - name: Exercise the SDK against the real Anvil server
      env:
        ANVIL_TS_SDK_CONFORMANCE: "1"
      run: cargo test --locked --test http_conformance daemon_conforms_to_checked_in_contract -- --nocapture

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # brokk-anvil-minimizer is versioned in lockstep with brokk-anvil; catch a
    # missed bump on the PR instead of at publish time.
    - name: Verify workspace version lockstep
      shell: bash
      run: |
        set -euo pipefail
        ROOT=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
        MINI=$(grep -m1 '^version = ' crates/anvil-minimizer/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
        REQ=$(grep -m1 '^anvil-minimizer = ' Cargo.toml | sed -E 's/.*version = "([^"]*)".*/\1/')
        if [ "$ROOT" != "$MINI" ] || [ "$ROOT" != "$REQ" ]; then
          echo "::error::Version lockstep violated: brokk-anvil=$ROOT, brokk-anvil-minimizer=$MINI, dependency requirement=$REQ. Bump all three together."
          exit 1
        fi
        echo "Workspace versions in lockstep: $ROOT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install pinned license tools
      run: |
        cargo install --locked cargo-about --version 0.9.1 --features cli
        cargo install --locked cargo-deny --version 0.20.2

    - name: Check dependency license policy
      run: cargo deny --config licenses/deny.toml --locked check licenses

    - name: Check shipped notice reports
      run: |
        cargo about generate --offline --config licenses/about.toml --locked --fail licenses/about.hbs -o /tmp/THIRD_PARTY_LICENSES.html
        diff -u licenses/THIRD_PARTY_LICENSES.html /tmp/THIRD_PARTY_LICENSES.html
        node scripts/generate-supplemental-third-party-notices.mjs /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt
        diff -u licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        # `build.rs` cross-compiles the `brokk-acp-sandbox` crate to
        # `wasm32-wasip2` and embeds the resulting `.wasm` bytes via
        # `include_bytes!`, so the runner must have the target's
        # std-aware sysroot available before `cargo build`.
        targets: wasm32-wasip2

    - name: Install bubblewrap (Linux sandbox runtime)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y bubblewrap

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-

    - name: Check Rust formatting
      run: cargo fmt --check

    - name: Run Clippy lints
      run: cargo clippy --all-targets -- -D warnings

    # ACP-only configuration (#346): the http-api feature is default-on,
    # but the opt-out build must keep compiling and linting or the gated
    # code rots.
    - name: Run Clippy lints (ACP-only, no http-api)
      run: cargo clippy --all-targets --no-default-features --features wasm-sandbox -- -D warnings

    - name: Build Anvil
      run: cargo build --release

    - name: Run tests
      run: cargo test

    - name: Run minimizer crate tests
      run: cargo test -p brokk-anvil-minimizer --locked

  build-android:
    name: Build aarch64-linux-android
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        # Android builds still embed the sandbox guest, so the runner needs
        # both the host cross target and the nested wasm target available.
        targets: aarch64-linux-android,wasm32-wasip2

    - name: Install Android SDK + NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      shell: bash
      run: sdkmanager "ndk;29.0.13113456"

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          android-aarch64-cargo-

    - name: Build Anvil for Android
      env:
        ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456
        CC_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        CXX_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
        AR_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
      run: cargo build --release --locked --target aarch64-linux-android
