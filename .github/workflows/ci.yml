name: CI

on:
  push:
    branches: [ 'master', 'ci/**' ]
  pull_request:
    branches: [ 'master' ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        # `build.rs` cross-compiles the `brokk-acp-sandbox` crate to
        # `wasm32-wasip2` and embeds the resulting `.wasm` bytes via
        # `include_bytes!`, so the runner must have the target's
        # std-aware sysroot available before `cargo build`.
        targets: wasm32-wasip2

    - name: Install bubblewrap (Linux sandbox runtime)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y bubblewrap

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check Rust formatting
      run: cargo fmt --check

    - name: Run Clippy lints
      run: cargo clippy --all-targets -- -D warnings

    - name: Build Anvil
      run: cargo build --release

    - name: Run tests
      run: cargo test
