name: CI

on:
  push:
    branches: [ 'master', 'ci/**' ]
  pull_request:
    branches: [ 'master' ]

# Harden cargo's network layer against transient crates.io index fetches that
# intermittently abort a job with `[16] Error in the HTTP2 framing layer` while
# curl pulls the sparse index over HTTP/2. Forcing HTTP/1.1 sidesteps the
# multiplexing bug and the retry bump rides out brief CDN blips.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  npm-packaging:
    name: npm packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm --prefix npm test

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install pinned license tools
      run: |
        cargo install --locked cargo-about --version 0.9.1 --features cli
        cargo install --locked cargo-deny --version 0.20.2

    - name: Check dependency license policy
      run: cargo deny --config licenses/deny.toml --locked check licenses

    - name: Check shipped notice reports
      run: |
        cargo about generate --offline --config licenses/about.toml --locked --fail licenses/about.hbs -o /tmp/THIRD_PARTY_LICENSES.html
        diff -u licenses/THIRD_PARTY_LICENSES.html /tmp/THIRD_PARTY_LICENSES.html
        node scripts/generate-supplemental-third-party-notices.mjs /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt
        diff -u licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        # `build.rs` cross-compiles the `brokk-acp-sandbox` crate to
        # `wasm32-wasip2` and embeds the resulting `.wasm` bytes via
        # `include_bytes!`, so the runner must have the target's
        # std-aware sysroot available before `cargo build`.
        targets: wasm32-wasip2

    - name: Install bubblewrap (Linux sandbox runtime)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y bubblewrap

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-

    - name: Check Rust formatting
      run: cargo fmt --check

    - name: Run Clippy lints
      run: cargo clippy --all-targets -- -D warnings

    - name: Build Anvil
      run: cargo build --release

    - name: Run tests
      run: cargo test

    - name: Run minimizer crate tests
      run: cargo test -p anvil-minimizer --locked

  build-android:
    name: Build aarch64-linux-android
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        # Android builds still embed the sandbox guest, so the runner needs
        # both the host cross target and the nested wasm target available.
        targets: aarch64-linux-android,wasm32-wasip2

    - name: Install Android SDK + NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      shell: bash
      run: sdkmanager "ndk;29.0.13113456"

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          android-aarch64-cargo-

    - name: Build Anvil for Android
      env:
        ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456
        CC_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        CXX_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
        AR_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
      run: cargo build --release --locked --target aarch64-linux-android
