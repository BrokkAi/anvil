name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Harden cargo's network layer against transient crates.io index fetches that
# intermittently abort the release with `[16] Error in the HTTP2 framing layer`
# while curl pulls the sparse index over HTTP/2. Forcing HTTP/1.1 sidesteps the
# multiplexing bug and the retry bump rides out brief CDN blips.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  build-linux:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,wasm32-wasip2

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match Cargo.toml version ($CARGO_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Tag and Cargo.toml versions match: $CARGO_VERSION"

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package archive
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          name="brokk-anvil-${ref}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp "target/x86_64-unknown-linux-gnu/release/anvil" "$name/"
          cp README.md LICENSE licenses/GPL-3.0.md licenses/SOURCE.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/"
          zip -r "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: |
            brokk-anvil-*.zip
            brokk-anvil-*.zip.sha256
          if-no-files-found: error

  build-linux-arm64:
    name: Build aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,wasm32-wasip2

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match Cargo.toml version ($CARGO_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Tag and Cargo.toml versions match: $CARGO_VERSION"

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu

      - name: Package archive
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          name="brokk-anvil-${ref}-aarch64-unknown-linux-gnu"
          mkdir "$name"
          cp "target/aarch64-unknown-linux-gnu/release/anvil" "$name/"
          cp README.md LICENSE licenses/GPL-3.0.md licenses/SOURCE.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/"
          zip -r "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-unknown-linux-gnu
          path: |
            brokk-anvil-*.zip
            brokk-anvil-*.zip.sha256
          if-no-files-found: error

  build-android-arm64:
    name: Build aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-wasip2

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;29.0.13113456"

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match Cargo.toml version ($CARGO_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Tag and Cargo.toml versions match: $CARGO_VERSION"

      - name: Build release binary
        env:
          # Android releases embed the same wasm sandbox artifact as other
          # targets, so the NDK cross-linker and nested wasm target must
          # both be configured on the runner.
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456
          CC_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: cargo build --release --locked --target aarch64-linux-android

      - name: Package archive
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          name="brokk-anvil-${ref}-aarch64-linux-android"
          mkdir "$name"
          cp "target/aarch64-linux-android/release/anvil" "$name/"
          cp README.md LICENSE licenses/GPL-3.0.md licenses/SOURCE.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/"
          zip -r "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-android
          path: |
            brokk-anvil-*.zip
            brokk-anvil-*.zip.sha256
          if-no-files-found: error

  build-windows:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,wasm32-wasip2

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match Cargo.toml version ($CARGO_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Tag and Cargo.toml versions match: $CARGO_VERSION"

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package archive
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '/', '-'
          $name = "brokk-anvil-$ref-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\anvil.exe" -Destination $name
          Copy-Item "README.md", "LICENSE", "licenses\GPL-3.0.md", "licenses\SOURCE.md", "licenses\THIRD_PARTY_LICENSES.html", "licenses\SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt" -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Path "$name.zip.sha256" -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-pc-windows-msvc
          path: |
            brokk-anvil-*.zip
            brokk-anvil-*.zip.sha256
          if-no-files-found: error

  build-macos:
    name: Build universal-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,wasm32-wasip2

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match Cargo.toml version ($CARGO_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Tag and Cargo.toml versions match: $CARGO_VERSION"

      - name: Build x86_64 binary
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Build aarch64 binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/anvil \
            target/aarch64-apple-darwin/release/anvil \
            -output target/universal-apple-darwin/release/anvil
          lipo -info target/universal-apple-darwin/release/anvil

      - name: Package archive
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          name="brokk-anvil-${ref}-universal-apple-darwin"
          mkdir "$name"
          cp target/universal-apple-darwin/release/anvil "$name/"
          cp README.md LICENSE licenses/GPL-3.0.md licenses/SOURCE.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/"
          zip -r "$name.zip" "$name"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-apple-darwin
          path: |
            brokk-anvil-*.zip
            brokk-anvil-*.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [build-linux, build-linux-arm64, build-android-arm64, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/brokk-anvil-*.zip
            artifacts/brokk-anvil-*.zip.sha256

      - name: Announce release on Discord
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: bash scripts/announce-discord-release.sh

  publish-npm:
    name: Gate and dispatch npm publish
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tagged release workflows to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(git rev-list -n1 "$TAG")
          wait_for_workflow() {
            local workflow="$1" attempts=40
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              local runs latest status conclusion
              runs=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&head_sha=$tag_sha&per_page=100" \
                --jq '.workflow_runs' \
                | jq -c --arg tag "$TAG" '[.[] | select(.head_branch == $tag)]')
              latest=$(jq -c 'sort_by(.created_at) | last // empty' <<<"$runs")
              if [[ -z "$latest" ]]; then
                echo "Waiting for $workflow to start for $TAG ($attempt/$attempts)"
              else
                status=$(jq -r '.status' <<<"$latest")
                conclusion=$(jq -r '.conclusion // empty' <<<"$latest")
                if [[ "$status" == completed && "$conclusion" == success ]]; then
                  echo "$workflow passed for $TAG"
                  return 0
                fi
                if [[ "$status" == completed ]]; then
                  echo "::error::$workflow concluded $conclusion for $TAG"
                  return 1
                fi
                echo "Waiting for $workflow ($status, $attempt/$attempts)"
              fi
              sleep 30
            done
            echo "::error::Timed out waiting for $workflow to pass for $TAG"
            return 1
          }

          wait_for_workflow ci.yml
          wait_for_workflow docs.yml
          wait_for_workflow publish-crate.yml

      - name: Dispatch npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run publish-npm.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG" -f publish=true
